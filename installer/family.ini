; One family release of the Darwin's Cat amps: what every family installer reads —
; build-family-pkg.sh (macOS), darwinscat-amps.iss (Windows) and build-family-linux.sh (Linux).
;
; amps — the amps the release carries, in the order the installers list them, one space between.
; A name is the amp's CMake target, its PRODUCT_NAME and the stem of every bundle it builds
; (<build>/<Amp>_artefacts/Release/VST3/<Amp>.vst3 …). Taking an amp into the family is adding its
; name here.
[family]
name=Darwin's Cat Amps
amps=OrbitAmp CatpitAmp RedPawAmp
