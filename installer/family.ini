; One family release of the Darwin's Cat amps: what every family installer reads —
; build-family-pkg.sh (macOS), darwinscat-amps.iss (Windows), build-family-linux.sh (Linux), and
; build-family-zip.sh and sign-family-macos.sh beside them.
;
; amps — the amps the release carries, in the order the installers list them, one space between.
; A name is the amp's CMake target, its PRODUCT_NAME and the name of its standalone app
; (<build>/<Amp>_artefacts/Release/Standalone/<Amp>.app …). Taking an amp into the family is adding its
; name here.
;
; bundle — the name of the family's plug-ins: ONE bundle per format holds every amp of the release, each
; under the plug-in ids it always had (<bundle>.vst3, <bundle>.component on macOS, <bundle>.clap). It is
; the bundle target's PRODUCT_NAME, and the stem of every bundle it builds.
; bundle_target — the CMake target that builds them: <build>/<bundle_target>_artefacts/Release/{VST3,AU,CLAP}.
;
; old_bundles — the stems of the per-amp plug-in bundles the family's installers up to 0.8.0 laid
; (<Amp>.vst3, <Amp>.component, <Amp>.clap), one space between. Installing a format removes that format's
; bundles of these names from the folder the installers placed them in, and nothing else: a host that
; found both would see every amp twice, under the same ids. Plain names only — no spaces, no wildcards.
;
; bundle_code, bundle_id — the family's bundle's own plug-in code and its id (BUNDLE_ID, CLAP_ID, and the root of
; the macOS packages' ids): no plug-in a host is shown carries them, the amps inside carry their own; two families
; installed side by side keep them apart.
; app_id — the Windows installer's AppId, a GUID without its braces: the entry under Installed apps, kept for good once
; released — this one is OrbitAmp's own installer's, so an OrbitAmp installed before 0.8.0 is upgraded in place.
; archive — the stem of every file the release publishes: <archive>-<version>-<system>.pkg|setup.exe|zip|tar.xz.
; The data folder, Factory, is ONE for every family (src/device/FactorySet.h): each installer adds its files to it
; and takes away only its own.
;
; book — the family's changelog, whose section of a version is its GitHub Release's notes (tools/changelog-collect.mjs).
; version — the family's own version, where it is not the tree's: CMakeLists.txt's project() VERSION when not said
; (this family's); the basses say theirs. Every binary of the family's release shows it, and its tag must say it.
;
; A SECOND FAMILY is a second file like this one (bass.ini): the build reads the one FAMILY_INI names (CMake), the
; installers the one their FAMILY_INI says (an environment variable; /DFamilyIni= for Inno Setup), this file when
; none is said. Its release is tagged <tag_prefix><version> (release.yml).
[family]
name=Darwin's Cat Amps
amps=OrbitAmp CatpitAmp RedPawAmp FrostPawAmp AmberPawAmp
bundle=Darwin's Cat Amps
bundle_target=DarwinsCatAmps
old_bundles=OrbitAmp CatpitAmp RedPawAmp
bundle_code=Dcam
bundle_id=com.darwinscat.amps
app_id=62EA38AA-F6FB-446B-B92A-7F097A8ED667
archive=darwinscat-amps
tag_prefix=v
book=CHANGELOG.md
