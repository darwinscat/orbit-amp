name: release-catpit

# CatpitAmp's own release, apart from OrbitAmp's (release.yml): the same tree and the same engine,
# a version of its own and a tag of its own — catpit-vX.Y.Z beside OrbitAmp's vX.Y.Z. Neither
# workflow answers to the other's tags, so neither product waits for the other.
#
# A manual run (workflow_dispatch) builds the SAME artifacts but does NOT create a release unless
# dry_run=false, so they can be downloaded and tried from the run page without publishing.
#
#   • macOS  → signed + notarized .pkg + .zip (VST3 + AU + CLAP + Standalone, universal)  [self-hosted runner]
#   • Windows → .zip (VST3 + CLAP + Standalone; x64 and arm64)
#   • Linux  → .tar.gz (VST3 + CLAP + Standalone; x86_64 and arm64)
#
# An installer on macOS only (installer/build-pkg.sh, as OrbitAmp's); elsewhere a player puts the
# bundles where the host looks for them. The cockpit's packs and cabinets are inside every binary,
# so a bundle is all there is to carry.
#
# THE RELEASE IS PUBLISHED AS "NOT LATEST", AND THAT IS LOAD-BEARING. Every OrbitAmp build already
# out there asks GitHub for this repository's LATEST release and expects a tag that reads vX.Y.Z.
# A cockpit release marked latest would answer them with catpit-vX.Y.Z, which they cannot read —
# and they would stop seeing their own updates until OrbitAmp shipped again. The cockpit does not
# need "latest": it asks for the list and takes the releases that wear its prefix (src/Product.h).
#
# Required (signing only): secrets MACOS_APP_IDENTITY, MACOS_INSTALLER_IDENTITY, KCH_PWD; var
# NOTARY_PROFILE — the same ones release.yml uses. The GitHub Release is published with the
# built-in GITHUB_TOKEN.

on:
  push:
    tags: [ 'catpit-v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (manual runs)"
        required: true
        default: "0.1.0"
      dry_run:
        description: "Build only — do NOT create a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  version:
    # ONE PLACE READS THE VERSION, and refuses a tag that disagrees with the tree. The number in
    # the binary — on the cockpit's plate, in its bundle, in its update check — comes from
    # CATPITAMP_VERSION in CMakeLists.txt, not from the tag; a release whose tag said one thing and
    # whose binary another would tell its own users, for ever, that they are out of date.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VER="${RAW#catpit-}"; VER="${VER#v}"
          TREE=$(sed -n 's/^set(CATPITAMP_VERSION \([0-9][0-9.]*\))$/\1/p' CMakeLists.txt)
          if [ -z "$TREE" ]; then
            echo "::error::CATPITAMP_VERSION not found in CMakeLists.txt"; exit 1
          fi
          if [ "$VER" != "$TREE" ]; then
            echo "::error::the tag says $VER, CMakeLists.txt says CATPITAMP_VERSION $TREE — bump one or re-tag"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  macos:
    # The `signing` label is REQUIRED, not decorative — see release.yml: only that runner carries
    # the Developer ID certs and the notarytool keychain profile.
    needs: version
    runs-on: [self-hosted, macOS, signing]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DORBITAMP_JUCE_DIR= -DORBITAMP_FCORE_DIR= -DORBITAMP_GUITAR_DIR= -DORBITAMP_APPKIT_DIR= \
            -DORBITAMP_NAM_CORE_SRC= -DORBITAMP_NAMZ_SRC= \
            -DORBITAMP_COPY_PLUGIN=OFF
          # By name: the cockpit is not part of the default build. The gates are the engine's, and
          # the engine is what this release ships.
          cmake --build build --config Release --parallel --target CatpitAmp_All \
            orbitamp_captured_test orbitamp_chain_test orbitamp_library_test \
            orbitamp_reverb_test orbitamp_ribbon_test orbitamp_eqlink_test orbitamp_tuner_test \
            orbitamp_factory_test
      - name: Gates
        run: |
          set -euo pipefail
          for t in captured chain library reverb ribbon factory; do
            bin=$(find "build/orbitamp_${t}_test_artefacts" -type f -perm +111 | head -1)
            echo "-- gate: $t"; "$bin" > /dev/null
          done
          echo "-- gate: eqlink"; ./build/orbitamp_eqlink_test > /dev/null
          echo "-- gate: tuner";  ./build/orbitamp_tuner_test  > /dev/null
      - name: Sign, notarize, package
        env:
          APP_ID:  ${{ secrets.MACOS_APP_IDENTITY }}
          INST_ID: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY:  ${{ vars.NOTARY_PROFILE }}
          KCH_PWD: ${{ secrets.KCH_PWD }}
        run: |
          set -euo pipefail

          # Let codesign/productsign use the signing keys without a GUI prompt — see release.yml.
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KCH_PWD" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCH_PWD" "$KEYCHAIN" >/dev/null

          VER="${{ needs.version.outputs.version }}"
          REL="build/CatpitAmp_artefacts/Release"
          VST3="$REL/VST3/CatpitAmp.vst3"; AU="$REL/AU/CatpitAmp.component"; CLAP="$REL/CLAP/CatpitAmp.clap"
          APP="$REL/Standalone/CatpitAmp.app"
          mkdir -p dist
          rm -rf stage && mkdir -p stage

          # A ticket takes a moment to reach the replica stapler asks — see release.yml.
          staple_retry() {
            local item="$1" i
            for i in 1 2 3 4 5; do
              xcrun stapler staple "$item" && return 0
              echo "staple: no ticket yet for $item (attempt $i of 5) — waiting for it to propagate"
              sleep 20
            done
            return 1
          }

          # Plug-ins: hardened-runtime sign (they run inside the host → no own entitlements).
          BUNDLES=("$VST3" "$AU" "$CLAP")
          for b in "${BUNDLES[@]}"; do
            codesign --force --options runtime --timestamp --sign "$APP_ID" "$b"
            codesign --verify --strict --verbose=1 "$b"
          done

          # The standalone: its own process → the audio-input entitlement, under the hardened runtime.
          codesign --force --options runtime --timestamp \
                   --entitlements installer/standalone.entitlements --sign "$APP_ID" "$APP"
          codesign --verify --strict --verbose=1 "$APP"
          BUNDLES+=("$APP")

          # One submission for all four, and a ticket on each — see release.yml.
          for b in "${BUNDLES[@]}"; do cp -R "$b" stage/; done
          ditto -c -k stage dist/_bundles.zip
          xcrun notarytool submit dist/_bundles.zip --keychain-profile "$NOTARY" --wait
          rm -f dist/_bundles.zip

          # The ticket goes on the ORIGINAL, and the archive is made from what already carries it.
          rm -rf stage && mkdir -p stage
          for b in "${BUNDLES[@]}"; do
            staple_retry "$b"
            xcrun stapler validate "$b"
            codesign --verify --deep --strict "$b"
            cp -R "$b" stage/
          done
          ditto -c -k stage "dist/CatpitAmp-$VER-macOS.zip"

          # build → sign → notarize → staple the .pkg, from the same stapled bundles — see release.yml.
          installer/build-pkg.sh "$VER" "$REL" dist CatpitAmp
          productsign --sign "$INST_ID" "dist/CatpitAmp-$VER-macOS.pkg" "dist/CatpitAmp-$VER-macOS-signed.pkg"
          mv "dist/CatpitAmp-$VER-macOS-signed.pkg" "dist/CatpitAmp-$VER-macOS.pkg"
          xcrun notarytool submit "dist/CatpitAmp-$VER-macOS.pkg" --keychain-profile "$NOTARY" --wait
          staple_retry "dist/CatpitAmp-$VER-macOS.pkg"
          xcrun stapler validate "dist/CatpitAmp-$VER-macOS.pkg"
          spctl -a -vvv -t install "dist/CatpitAmp-$VER-macOS.pkg" || true
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64,   plat: x64   }
          - { runner: windows-11-arm, arch: arm64, plat: ARM64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -B build -A ${{ matrix.plat }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel --target CatpitAmp_All
      - name: Zip
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rel = "build\CatpitAmp_artefacts\Release"
          $items = @("$rel\VST3\CatpitAmp.vst3", "$rel\CLAP\CatpitAmp.clap", "$rel\Standalone\CatpitAmp.exe")
          Compress-Archive -Force -DestinationPath "dist\CatpitAmp-$ver-Windows-${{ matrix.arch }}.zip" -Path $items
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64  }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target CatpitAmp_All \
            orbitamp_captured_test orbitamp_chain_test orbitamp_library_test \
            orbitamp_reverb_test orbitamp_ribbon_test orbitamp_eqlink_test orbitamp_tuner_test \
            orbitamp_factory_test
      - name: Gates
        run: |
          set -euo pipefail
          for t in captured chain library reverb ribbon factory; do
            bin=$(find "build/orbitamp_${t}_test_artefacts" -type f -executable | head -1)
            echo "-- gate: $t"; "$bin" > /dev/null
          done
          echo "-- gate: eqlink"; ./build/orbitamp_eqlink_test > /dev/null
          echo "-- gate: tuner";  ./build/orbitamp_tuner_test  > /dev/null
      - name: Package (.tar.gz)
        run: |
          VER="${{ needs.version.outputs.version }}"
          REL="build/CatpitAmp_artefacts/Release"
          mkdir -p stage dist
          cp -R "$REL/VST3/CatpitAmp.vst3" stage/
          cp -R "$REL/CLAP/CatpitAmp.clap" stage/      # a single file here, not a bundle — see release.yml
          cp "$REL/Standalone/CatpitAmp" stage/
          tar -C stage -czf "dist/CatpitAmp-$VER-Linux-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [ version, macos, windows, linux ]
    # Tag push → publish. Manual run → only if dry_run=false (default true = build-only).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The tags are wanted, not the files: the notes start at the cockpit's PREVIOUS release, and
      # the repository's previous tag is as likely to be OrbitAmp's.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          TAG="catpit-v$VER"
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ( cd out && sha256sum CatpitAmp-* > SHA256SUMS )

          PREV=$(git tag --list 'catpit-v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          NOTES=( --generate-notes )
          if [ -n "$PREV" ]; then NOTES+=( --notes-start-tag "$PREV" ); fi

          # --latest=false: see the top of this file. Do not remove it.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "CatpitAmp v$VER" \
            --latest=false \
            "${NOTES[@]}" \
            out/*
