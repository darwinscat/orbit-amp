name: build

# Windows-only CI — on purpose. We develop on a Mac, so macOS is built + validated
# locally; this workflow covers the build we can't make locally: Windows (to hand a
# tester or cross-check). The universal macOS build happens only in release.yml, on a tag.
#
# Runs on demand, on a PR that touches code, and when such a PR lands on main — not on every
# commit. The run on main is for the caches: a PR reads only its own caches and main's, so
# without it every new PR compiles from nothing (about 65 minutes with four products).

on:
  pull_request:
    paths: &code
      - 'src/**'
      - 'CMakeLists.txt'
      - 'resources/**'
      - 'tests/**'
      - 'tools/run-gates.sh'
      - 'installer/family.ini'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths: *code
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo and uploads
# build artifacts. Nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90          # safety cap for a hung build; a build from an empty cache takes about 65
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      # Ninja invokes cl.exe directly, so it needs the MSVC toolchain on PATH.
      - name: MSVC dev environment (vcvars for Ninja)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1.13.0
        with:
          arch: x64

      # Compiler cache. MUST precede Configure: JUCE builds juceaide at configure time and
      # passes the compiler launcher through to that sub-build.
      - name: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696   # v0.0.10

      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-windows-ninja-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      # The cockpit is not part of the default build, so that OrbitAmp's build can never fail on it. It
      # is built here by name, every format of it: this is the only place a pull request meets MSVC with it.
      - name: Build CatpitAmp
        run: cmake --build build --target CatpitAmp_All

      # The rover likewise: not in the default build, built here by name.
      - name: Build RedPawAmp
        run: cmake --build build --target RedPawAmp_All

      # ...and the ice moon's rover, the same dashboard in a skin of its own.
      - name: Build FrostPawAmp
        run: cmake --build build --target FrostPawAmp_All

      # ...and the helicopter over Titan, the same dashboard in a cockpit of its own.
      - name: Build AmberPawAmp
        run: cmake --build build --target AmberPawAmp_All

      # Every gate of the one list (tests/gates.txt) — the faces' are built only when asked for.
      - name: Build the gates
        run: cmake --build build --target Family_Gates

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # The acceptance gates: the one list (tests/gates.txt), the same the family's release runs on every
      # system and the local release runs — run, logged and, on Windows, diagnosed by tools/run-gates.sh.
      - name: Gates
        shell: bash
        run: tools/run-gates.sh build Release

      - name: Validate (pluginval, VST3)
        shell: bash
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip
          7z x -y pluginval.zip >/dev/null
          ./pluginval.exe --strictness-level 10 --validate "build/OrbitAmp_artefacts/Release/VST3/OrbitAmp.vst3"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrbitAmp-Windows
          if-no-files-found: ignore
          path: |
            build/OrbitAmp_artefacts/Release/VST3/OrbitAmp.vst3
            build/OrbitAmp_artefacts/Release/CLAP/OrbitAmp.clap
            build/OrbitAmp_artefacts/Release/Standalone
