name: build

# Windows-only CI — on purpose. We develop on a Mac, so macOS is built + validated
# locally; this workflow covers the build we can't make locally: Windows (to hand a
# tester or cross-check). The universal macOS build happens only in release.yml, on a tag.
#
# Runs on demand, on a PR that touches code, and when such a PR lands on main — not on every
# commit. The run on main is for the caches: a PR reads only its own caches and main's, so
# without it every new PR compiles from nothing (about 65 minutes with four products).

on:
  pull_request:
    paths: &code
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'resources/**'
      - 'tests/**'
      - 'tools/run-gates.sh'
      - 'installer/family.ini'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths: *code
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo and uploads
# build artifacts. Nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150         # safety cap for a hung build; five amps and their gates from a cold cache ran past 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      # Ninja invokes cl.exe directly, so it needs the MSVC toolchain on PATH.
      - name: MSVC dev environment (vcvars for Ninja)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1.13.0
        with:
          arch: x64

      # Compiler cache. MUST precede Configure: JUCE builds juceaide at configure time and
      # passes the compiler launcher through to that sub-build.
      - name: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696   # v0.0.10

      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-windows-ninja-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      # THE FAMILY'S RELEASE, as the release builds it: the family's plug-ins — one VST3 and one CLAP holding
      # every amp installer/family.ini names (CMakeLists.txt: THE FAMILY'S PLUG-INS) — and each of those
      # amps' Standalone. The faces are not part of the default build, so that OrbitAmp's build can never
      # fail on them: this is the only place a pull request meets MSVC with the cockpit and the rovers.
      - name: Build the family (Family_All)
        run: cmake --build build --target Family_All

      # Every gate of the one list (tests/gates.txt) — the faces' are built only when asked for.
      - name: Build the gates
        run: cmake --build build --target Family_Gates

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # The acceptance gates: the one list (tests/gates.txt), the same the family's release runs on every
      # system and the local release runs — run, logged and, on Windows, diagnosed by tools/run-gates.sh.
      - name: Gates
        shell: bash
        run: tools/run-gates.sh build Release

      # The family's plug-ins as a host opens them (tests/BundleHost.cpp): every amp under the ids its own
      # bundle shipped with, each its own amp, all of them alive and playing at once, in the VST3 and the CLAP.
      - name: The family's plug-ins in a host
        shell: bash
        run: |
          cmake --build build --target orbitamp_bundle_host
          build/orbitamp_bundle_host_artefacts/Release/orbitamp_bundle_host.exe \
            "build/DarwinsCatAmps_artefacts/Release/VST3/Darwin's Cat Amps.vst3" \
            "build/DarwinsCatAmps_artefacts/Release/CLAP/Darwin's Cat Amps.clap"

      # pluginval validates every plug-in the bundle holds, one after another.
      - name: Validate (pluginval, VST3)
        shell: bash
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip
          7z x -y pluginval.zip >/dev/null
          ./pluginval.exe --strictness-level 10 --validate "build/DarwinsCatAmps_artefacts/Release/VST3/Darwin's Cat Amps.vst3"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DarwinsCatAmps-Windows
          if-no-files-found: ignore
          path: |
            build/DarwinsCatAmps_artefacts/Release/VST3
            build/DarwinsCatAmps_artefacts/Release/CLAP
            build/*_artefacts/Release/Standalone
