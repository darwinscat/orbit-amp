name: release

# THE FAMILY'S RELEASE — Darwin's Cat Amps: every amp installer/family.ini names, one version, one tag
# (vX.Y.Z), one GitHub Release that carries them all — GitHub hosts the binaries, no own download server.
# A manual run (workflow_dispatch) builds the SAME artifacts but does NOT create a release unless
# dry_run=false, so you can download + test installers from the run page without publishing.
#
#   • macOS   → one signed + notarized .pkg, universal, and no zip: VST3 + AU + CLAP + Standalone  [self-hosted runner]
#   • Windows → one Inno Setup .exe (x64), and a .zip for x64 and for arm64: VST3 + CLAP + Standalone
#   • Linux   → one .tar.xz for x86_64 and for arm64: VST3 + CLAP + Standalone, with install.sh
#
# Every plug-in format is ONE bundle with every amp in it, "Darwin's Cat Amps" (installer/family.ini:
# `bundle=`, built by the `bundle_target=` target, <build>/DarwinsCatAmps_artefacts); the standalones are
# one per amp (<build>/<Amp>_artefacts). The packing scripts read both from family.ini.
#
# Every system builds Family_All — the family's plug-ins and every amp's Standalone — and runs the one gate list
# (tests/gates.txt, tools/run-gates.sh) before it packs anything. The notes are the family's book: the
# release's own section of CHANGELOG.md (tools/changelog-collect.mjs --notes).
#
# THE SYMBOLS OF WHAT SHIPPED. Every build here is configured with ORBITAMP_KEEP_SYMBOLS=ON (CMakeLists.txt: A
# RELEASE KEEPS THE SYMBOLS OF WHAT IT SHIPPED): each shipped binary keeps its .dSYM, .pdb or .debug file in
# build/symbols before it is stripped, and each job uploads that folder as an artifact of this run,
# symbols-<version>-<system>, kept 90 days — never as a release asset, never in an installer or a zip: they name
# every function of ours. A tagged release's go to the family's private archive as well (the `symbols` job, at the
# end). installer/README.md, "Reading a crash report", says how to read a report with them.
#
# Required (signing only): secrets MACOS_APP_IDENTITY, MACOS_INSTALLER_IDENTITY, KCH_PWD; var
# NOTARY_PROFILE. The GitHub Release is published with the built-in GITHUB_TOKEN.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.8.0 — empty takes the tree's (manual runs)"
        required: false
        default: ""
      dry_run:
        description: "Build only — do NOT create a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  version:
    # ONE PLACE READS THE VERSION, and refuses a tag that disagrees with the tree. The number in the
    # binaries — on every amp's plate, in its bundles, in its update check — comes from CMakeLists.txt's
    # project() VERSION, not from the tag; a release whose tag said one thing and whose binaries another
    # would tell its own players, for ever, that they are out of date. A release with no notes in the book
    # is refused here too: before five hours of building, not after.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            VER="$(installer/version.sh "$TAG")"
          elif [ -n "$INPUT" ]; then
            VER="$(installer/version.sh "$INPUT")"
          else
            VER="$(installer/version.sh)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Release notes
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        env:
          VER: ${{ steps.v.outputs.version }}
        run: node tools/changelog-collect.mjs --notes "$VER" > /dev/null

  macos:
    # Self-hosted macOS runner → universal arm64+x86_64 build. arm64 cross-compiles the x86_64 (Intel)
    # slice fine; the gates run the native half.
    #
    # The `signing` label is REQUIRED, not decorative: more than one self-hosted macOS runner is
    # registered, and only that one carries the Developer ID certs + the notarytool keychain profile.
    # Without it GitHub hands the job to whichever runner is free, and on the wrong machine the release
    # dies at `security unlock-keychain` with "The user name or passphrase you entered is not correct" —
    # which reads like a bad KCH_PWD secret but is really the wrong host.
    needs: version
    runs-on: [self-hosted, macOS, signing]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DORBITAMP_JUCE_DIR= -DORBITAMP_FCORE_DIR= -DORBITAMP_GUITAR_DIR= -DORBITAMP_APPKIT_DIR= \
            -DORBITAMP_NAM_CORE_SRC= -DORBITAMP_NAMZ_SRC= \
            -DORBITAMP_COPY_PLUGIN=OFF \
            -DORBITAMP_DEV_FACTORY=OFF \
            -DORBITAMP_KEEP_SYMBOLS=ON
          # NO DEV FACTORY: a released amp reads the factory folder the installer lays out, never this
          # runner's build/Factory — which on this runner, a working laptop, is there (CMakeLists.txt:
          # THE FACTORY FOLDER). The gates read build/Factory whatever this says.
          # EIGHT JOBS, NOT ALL OF THEM. This runner is someone's working laptop: `--parallel` with no number
          # is unlimited under Makefiles, and the universal build ran two hundred compilers at once.
          cmake --build build --config Release --parallel 8 --target Family_All Family_Gates
      - name: Gates
        run: tools/run-gates.sh build Release
      # Sign (Developer ID) + notarize + staple, then the package. Signing identities + the
      # notarytool keychain-profile name come from repo secrets/vars; the certs + profile live in the
      # runner's Keychain.
      - name: Sign, notarize, package
        env:
          APP_IDENTITY:       ${{ secrets.MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_PROFILE:     ${{ vars.NOTARY_PROFILE }}
          KCH_PWD:            ${{ secrets.KCH_PWD }}
          VER:                ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Let codesign/productbuild use the signing keys without a GUI prompt — required when the
          # runner has no interactive login session. Idempotent per run.
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KCH_PWD" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCH_PWD" "$KEYCHAIN" >/dev/null
          installer/sign-family-macos.sh "$VER" build dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
      # The .dSYM of every shipped bundle, universal (above: THE SYMBOLS OF WHAT SHIPPED).
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ needs.version.outputs.version }}-macos
          path: build/symbols/
          retention-days: 90
          if-no-files-found: error

  windows:
    # Native x64 + arm64. windows-11-arm is a free hosted runner for public repos. x64 also gets the Inno
    # installer; arm64 is zip-only (ISCC is x86 + the audience is technical), which sidesteps running the
    # installer toolchain under ARM.
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64,   plat: x64,   installer: true  }
          - { runner: windows-11-arm, arch: arm64, plat: ARM64, installer: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240         # every amp and every gate — each face's gates compile the face again — from no cache
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -B build -A ${{ matrix.plat }} -DCMAKE_BUILD_TYPE=Release -DORBITAMP_DEV_FACTORY=OFF -DORBITAMP_KEEP_SYMBOLS=ON
          cmake --build build --config Release --parallel --target Family_All Family_Gates
      - name: Gates
        shell: bash
        run: tools/run-gates.sh build Release
      # WHICH INNO SETUP. The family's script is proven with Inno Setup 6 (6.7.3) and 7 (7.1.0), and the
      # two install into folders of their own names — a path written out for "Inno Setup 6" misses a 7,
      # and the image, or Chocolatey's newest package, may bring either. So ISCC is looked for, not
      # assumed: on PATH, then in an "Inno Setup *" folder of either Program Files, the highest version
      # first; Chocolatey installs one only when there is none. ISCC names its version as it starts.
      - name: Inno Setup installer
        if: ${{ matrix.installer }}
        shell: pwsh
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          function Find-Iscc {
            $onPath = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($onPath) { return $onPath.Source }
            $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
            $found = foreach ($r in $roots) { Get-ChildItem -Path (Join-Path $r 'Inno Setup *\ISCC.exe') -ErrorAction SilentlyContinue }
            $found | Sort-Object { $_.VersionInfo.FileMajorPart }, { $_.VersionInfo.FileMinorPart }, { $_.VersionInfo.FileBuildPart } -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "no ISCC.exe on this runner, and Chocolatey did not bring one" }
          Write-Host "ISCC: $iscc"
          & $iscc "/DAppVersion=$env:VER" installer\darwinscat-amps.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "installer\output\*.exe" dist\
      - name: Zip
        shell: bash
        env:
          VER: ${{ needs.version.outputs.version }}
        run: installer/build-family-zip.sh "$VER" build dist "windows-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
      # The .pdb of every shipped .vst3, .clap and .exe (above: THE SYMBOLS OF WHAT SHIPPED).
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}
          path: build/symbols/
          retention-days: 90
          if-no-files-found: error

  linux:
    # Native x86_64 + arm64 — both are free hosted runners for public repos.
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64  }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240         # every amp and every gate, from no cache
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORBITAMP_DEV_FACTORY=OFF -DORBITAMP_KEEP_SYMBOLS=ON
          cmake --build build --target Family_All Family_Gates
      - name: Gates
        run: tools/run-gates.sh build Release
      - name: Package (.tar.xz)
        env:
          VER: ${{ needs.version.outputs.version }}
        run: installer/build-family-linux.sh "$VER" build dist "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
      # The .debug file of every shipped library and app (above: THE SYMBOLS OF WHAT SHIPPED).
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: build/symbols/
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [ version, macos, windows, linux ]
    # Tag push → publish. Manual run → only if dry_run=false (default true = build-only).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # For the book and the tool that reads it.
      - uses: actions/checkout@v7
      # WHAT SHIPS, AND NOTHING ELSE: the systems' packages, by name — never the symbols-* artifacts beside them.
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: artifacts/macos
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          # Every file a release publishes is one of its packages, darwinscat-amps-*; anything else — a symbol
          # file above all — stops it here, before anything is published.
          stray="$(find out -type f ! -name 'darwinscat-amps-*')"
          if [ -n "$stray" ]; then
            echo "refusing to publish what is not a package of the release:" >&2
            echo "$stray" >&2
            exit 1
          fi
          ( cd out && sha256sum darwinscat-amps-* > SHA256SUMS )
          node tools/changelog-collect.mjs --notes "$VER" > notes.md

          # --latest: every amp asks GitHub for this repository's LATEST release and reads a vX.Y.Z there.
          # --target: a manual run may name a tag that does not exist yet; it is made on the commit built.
          gh release create "v$VER" \
            --repo "${{ github.repository }}" \
            --title "Darwin's Cat Amps v$VER" \
            --latest \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            out/*

  symbols:
    # THE SYMBOLS OF A PUBLISHED RELEASE, KEPT FOR GOOD. The run's symbols-* artifacts live 90 days; a tagged
    # release's go to the family's private archive as well, one folder a version — releases/vX.Y.Z/, each
    # artifact a folder in it, as downloaded. Tagged releases only: a manual run, dry or not, keeps its
    # artifacts and nothing more. The archive's sftp address is the repository variable SYMBOLS_SFTP (the
    # archive takes sftp and nothing else); the signing runner holds the key it admits. A release whose
    # archiving fails is still published — the artifacts stay on the run for 90 days, to upload by hand.
    needs: [ version, release ]
    if: ${{ github.event_name == 'push' }}
    runs-on: [self-hosted, macOS, signing]
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: symbols-*
          path: symbols
      - name: Archive the symbols
        env:
          VER: ${{ needs.version.outputs.version }}
          DEST: ${{ vars.SYMBOLS_SFTP }}
        run: |
          set -euo pipefail
          [ -n "$DEST" ] || { echo "the repository variable SYMBOLS_SFTP is not set" >&2; exit 1; }
          ls -d symbols/symbols-* > /dev/null
          {
            echo "-mkdir releases/v$VER"
            for d in symbols/symbols-*/; do echo "put -R ${d%/} releases/v$VER/"; done
            echo "ls -l releases/v$VER"
          } > symbols-batch.txt
          sftp -b symbols-batch.txt -o BatchMode=yes "$DEST"
